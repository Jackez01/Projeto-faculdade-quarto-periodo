{% extends 'estoque/base.html' %}
{% block title %}Excluir categoria{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Excluir categoria</h1>
</div>

<div class="card form-card">
  <p>Tem certeza que deseja excluir a categoria <strong>{{ categoria.nome }}</strong>?</p>
  <p style="color: var(--tinta-suave);">Só é possível excluir categorias que não têm produtos.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button type="submit" class="btn btn-perigo">Sim, excluir</button>
      <a class="btn btn-sec" href="{% url 'categoria_list' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
