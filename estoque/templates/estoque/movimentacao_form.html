{% extends 'estoque/base.html' %}
{% block title %}Registrar movimentação{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Registrar movimentação</h1>
</div>

<form method="post" class="card form-card" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button type="submit" class="btn">Registrar</button>
    <a class="btn btn-sec" href="{% url 'movimentacao_list' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
